<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal Loader Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .paypal-loader-container {
            background: white;
            border-radius: 12px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            min-width: 300px;
        }

        .loader-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            width: 120px;
            height: 120px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Círculo externo que gira */
        .circle-outer {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 4px solid transparent;
            border-top: 4px solid #0070ba;
            border-right: 4px solid #0070ba;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
        }

        /* Candado */
        .lock {
            position: relative;
            width: 60px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .lock-body {
            position: absolute;
            width: 40px;
            height: 35px;
            border: 3px solid #999;
            border-radius: 5px 5px 0 0;
            top: 25px;
        }

        .lock-shackle {
            position: absolute;
            width: 35px;
            height: 35px;
            border: 3px solid #999;
            border-radius: 50%;
            top: 0;
            border-bottom: none;
        }

        .lock-hole {
            position: absolute;
            width: 8px;
            height: 12px;
            background: #999;
            border-radius: 4px;
            top: 38px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Animaciones */
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .text {
            color: #333;
            font-size: 14px;
            margin-top: 20px;
            letter-spacing: 0.5px;
        }

        .text.title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #0070ba;
        }

        .dot-animation {
            display: inline-block;
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% {
                content: '.';
            }
            40% {
                content: '..';
            }
            60% {
                content: '...';
            }
            80%, 100% {
                content: '';
            }
        }

        /* Alternativa: versión más minimalista */
        .loader-container-minimal {
            background: white;
            border-radius: 8px;
            padding: 40px;
            margin: 40px 0;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .minimal-loader {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            position: relative;
        }

        .spinner {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid #f0f0f0;
            border-top: 3px solid #0070ba;
            border-radius: 50%;
            animation: spin 2s linear infinite;
        }

        .lock-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            color: #0070ba;
            z-index: 10;
        }
    </style>
</head>
<body>
    <!-- Versión 1: Loader con diseño realista -->
    <div class="paypal-loader-container">
        <div class="loader-wrapper">
            <div class="circle-outer"></div>
            <div class="lock">
                <div class="lock-body"></div>
                <div class="lock-shackle"></div>
                <div class="lock-hole"></div>
            </div>
        </div>
        <p class="text title">Procesando</p>
        <p class="text">Por favor espera<span class="dot-animation"></span></p>
    </div>

    <!-- Versión 2: Loader minimalista -->

        <div class="minimal-loader">
            <div class="spinner"></div>
            <div class="lock-icon">🔒</div>
        </div>
        <p class="text title">Cargando</p>
        <p class="text">Procesando tu solicitud<span class="dot-animation"></span></p>
    </div>
    -->
</body>
</html>
