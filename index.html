<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal - Google Chrome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Barra de navegación oscura */
        .browser-bar {
            width: 100%;
            height: 56px;
            background: #323232;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
        }

        .browser-icon {
            width: 20px;
            height: 20px;
            color: #9e9e9e;
            font-size: 16px;
            cursor: pointer;
        }

        .url-bar {
            flex: 1;
            height: 32px;
            background: transparent;
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #9e9e9e;
            gap: 6px;
        }

        .url-bar .lock {
            font-size: 14px;
        }

        .browser-controls {
            display: flex;
            gap: 8px;
        }

        .browser-controls span {
            width: 24px;
            height: 24px;
            color: #9e9e9e;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* Contenido principal */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
        }

        /* Spinner con círculo */
        .spinner-container {
            position: relative;
            width: 120px;
            height: 120px;
        }

        /* Círculo de fondo gris */
        .spinner-bg {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 8px solid #e8e8e8;
            border-radius: 50%;
            top: 0;
            left: 0;
        }

        /* Círculo azul que gira */
        .spinner-blue {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 8px solid transparent;
            border-top-color: #0070ba;
            border-right-color: #0070ba;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            top: 0;
            left: 0;
        }

        /* Candado en el centro */
        .lock-icon {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .lock-svg {
            width: 48px;
            height: 48px;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <!-- Barra de navegador oscura -->
    <div class="browser-bar">
        <span class="browser-icon">⊖</span>
        <div class="url-bar">
            <span class="lock">🔒</span>
            <span>about:blank</span>
        </div>
        <div class="browser-controls">
            <span>🔍</span>
            <span>⬇</span>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <div class="spinner-container">
            <!-- Círculo de fondo gris -->
            <div class="spinner-bg"></div>
            
            <!-- Círculo azul que gira -->
            <div class="spinner-blue"></div>
            
            <!-- Candado en el centro -->
            <div class="lock-icon">
                <svg class="lock-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
                    <!-- Arco superior -->
                    <path d="M 7 10 A 5 5 0 0 1 17 10" stroke="#b0b0b0" stroke-width="1.5" stroke-linecap="round"/>
                    
                    <!-- Cuerpo del candado -->
                    <rect x="6" y="10" width="12" height="10" rx="1" stroke="#b0b0b0" stroke-width="1.5" fill="none"/>
                    
                    <!-- Punto del candado -->
                    <circle cx="12" cy="16" r="1" fill="#b0b0b0"/>
                </svg>
            </div>
        </div>
    </div>
</body>
</html>
