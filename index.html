<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal - Cargando</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Barra del navegador */
        .browser-bar {
            width: 100%;
            height: 56px;
            background: #343434;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            border-bottom: 1px solid #2a2a2a;
        }

        .browser-logo {
            width: 24px;
            height: 24px;
            background-image: url('https://brandlogos.net/wp-content/uploads/2021/11/paypal-logo-512x512.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .browser-title {
            font-size: 13px;
            color: #e0e0e0;
            flex: 1;
        }

        .browser-controls {
            display: flex;
            gap: 16px;
            margin-left: auto;
        }

        .browser-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9e9e9e;
            cursor: pointer;
            font-size: 18px;
        }

        /* Contenedor principal */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
        }

        /* Spinner pequeño */
        .spinner-container {
            position: relative;
            width: 80px;
            height: 80px;
        }

        /* Círculo de fondo gris */
        .spinner-bg {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 6px solid #e8e8e8;
            border-radius: 50%;
            top: 0;
            left: 0;
        }

        /* Círculo azul que gira */
        .spinner-blue {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 6px solid transparent;
            border-top-color: #0070ba;
            border-right-color: #0070ba;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            top: 0;
            left: 0;
        }

        /* Candado en el centro */
        .lock-icon {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .lock-svg {
            width: 36px;
            height: 36px;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <!-- Barra del navegador -->
    <div class="browser-bar">
        <div class="browser-logo"></div>
        <div class="browser-title">Pago con PayPal - Google Chrome</div>
        <div class="browser-controls">
            <div class="browser-btn">−</div>
            <div class="browser-btn">□</div>
            <div class="browser-btn">✕</div>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
    <div class="spinner-container">
        <!-- Círculo de fondo gris -->
        <div class="spinner-bg"></div>
        
        <!-- Círculo azul que gira -->
        <div class="spinner-blue"></div>
        
        <!-- Candado en el centro -->
        <div class="lock-icon">
            <svg class="lock-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
                <!-- Arco superior -->
                <path d="M 7 10 A 5 5 0 0 1 17 10" stroke="#b0b0b0" stroke-width="1.5" stroke-linecap="round"/>
                
                <!-- Cuerpo del candado -->
                <rect x="6" y="10" width="12" height="10" rx="1" stroke="#b0b0b0" stroke-width="1.5" fill="none"/>
                
                <!-- Punto del candado -->
                <circle cx="12" cy="16" r="1" fill="#b0b0b0"/>
            </svg>
        </div>
    </div>
    </div>
</body>
</html>
