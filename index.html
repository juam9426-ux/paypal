<!DOCTYPE html>
<html data-ppui-mode="light" dir="ltr" lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pago con PayPal</title>
    <style>
        :root {
            --sys-color-background-main: #f1f2f3;
            --sys-color-background-alt: #dbdde0;
            --sys-color-background-surface: #fefefe;
            --sys-color-background-surface-hover: #f1f2f3;
            --sys-color-background-surface-active: #dbdde0;
            --sys-color-primary-main: #0544b5;
            --sys-color-primary-main-hover: #0070e0;
            --sys-color-primary-main-active: #003087;
            --sys-color-primary-contrast: #fff;
            --sys-color-link-main: #116eca;
            --sys-color-link-main-hover: #73a5ff;
            --sys-color-structure-border-high-contrast: #9198a0;
            --sys-color-structure-border-low-contrast: #cfd3d8;
            --sys-color-structure-divider: #dbdde0;
            --sys-color-success-main: #0c6e11;
            --sys-color-system-main: #001435;
            --sys-experimental-color-background-alt: #edf0f2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background: var(--sys-color-background-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            padding-top: calc(48px + 16px);
            line-height: 1.5;
            overflow: hidden;
        }

        /* Barra del navegador - SIEMPRE VISIBLE */
        .browser-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: #343434;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            border-bottom: 1px solid #2a2a2a;
            z-index: 99999;
        }

        /* ===== PANTALLA DE CARGA ===== */
        #loading-screen {
            position: fixed;
            top: 48px;
            left: 0;
            width: 100%;
            height: calc(100% - 48px);
            background: #ffffff;
            display: flex;
            flex-direction: column;
            z-index: 9999;
            transition: opacity 0.2s ease-out;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .browser-logo {
            width: 24px;
            height: 24px;
            background-image: url('https://brandlogos.net/wp-content/uploads/2021/11/paypal-logo-512x512.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .browser-title {
            font-size: 13px;
            color: #e0e0e0;
            flex: 1;
        }

        .browser-controls {
            display: flex;
            gap: 16px;
            margin-left: auto;
        }

        .browser-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9e9e9e;
            cursor: pointer;
            font-size: 18px;
        }

        /* Contenedor principal de carga */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
        }

        /* Spinner pequeño */
        .spinner-container {
            position: relative;
            width: 80px;
            height: 80px;
        }

        /* Círculo de fondo gris */
        .spinner-bg {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 6px solid #e8e8e8;
            border-radius: 50%;
            top: 0;
            left: 0;
        }

        /* Círculo azul que gira */
        .spinner-blue {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 6px solid transparent;
            border-top-color: #0070ba;
            border-right-color: #0070ba;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            top: 0;
            left: 0;
        }

        /* Candado en el centro */
        .lock-icon {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .lock-svg {
            width: 36px;
            height: 36px;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== PANTALLA DE CHECKOUT ===== */
        .container {
            width: 92%;
            max-width: 440px;
            background: var(--sys-color-background-surface);
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(1, 5, 6, 0.12);
            display: flex;
            flex-direction: column;
            max-height: 90vh;
            overflow: hidden;
            display: none;
        }

        .container.visible {
            display: flex;
        }

        /* HEADER - SIEMPRE FIJO ARRIBA */
        .header {
            padding: 18px 22px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            background: var(--sys-color-background-surface);
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
        }

        .logo-icon {
            display: none;
        }

        .logo-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: #000;
            letter-spacing: -0.5px;
        }

        .close-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            color: var(--sys-color-structure-border-high-contrast);
            font-size: 20px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
        }

        .close-btn:hover {
            background: var(--sys-color-background-surface-hover);
        }

        /* CONTENT */
        .content {
            padding: 18px 22px;
            flex: 1;
            overflow-y: auto;
        }

        /* SECTION: Pagar con */
        .section {
            margin-bottom: 0;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 12px 0;
            cursor: pointer;
            user-select: none;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #000;
            text-transform: capitalize;
            letter-spacing: 0px;
        }

        .section-chevron {
            color: #666;
            font-size: 16px;
            transition: transform 0.3s;
            line-height: 1;
        }

        .section-chevron.open {
            transform: rotate(180deg);
        }

        .section-content {
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .section-content.collapsed {
            max-height: 0;
            overflow: hidden;
        }

        /* PAYMENT METHODS */
        .payment-method {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 8px;
            border: 2px solid var(--sys-color-structure-border-low-contrast);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--sys-color-background-surface);
            position: relative;
        }

        .payment-method:hover {
            border-color: var(--sys-color-structure-border-high-contrast);
            background: var(--sys-color-background-surface-hover);
        }

        .payment-method.active {
            border-color: #222;
            background: var(--sys-color-background-surface);
        }

        .radio {
            width: 18px;
            height: 18px;
            border: 2px solid var(--sys-color-structure-border-low-contrast);
            border-radius: 50%;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: var(--sys-color-background-surface);
            transition: all 0.2s;
        }

        .payment-method:hover .radio {
            border-color: var(--sys-color-structure-border-high-contrast);
        }

        .payment-method.active .radio {
            border-color: #000;
            background: #000;
        }

        .radio::after {
            content: '';
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            opacity: 0;
        }

        .payment-method.active .radio::after {
            opacity: 1;
        }

        .payment-icon {
            width: 40px;
            height: 26px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .payment-icon img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .payment-info {
            flex: 1;
        }

        .payment-name {
            font-size: 13px;
            font-weight: 500;
            color: #222;
            line-height: 1.2;
        }

        .payment-desc {
            font-size: 12px;
            color: var(--sys-color-structure-border-high-contrast);
            margin-top: 2px;
        }

        .payment-amount {
            font-size: 12px;
            font-weight: 600;
            color: #222;
            white-space: nowrap;
            margin-left: 12px;
        }

        /* LINK */
        .show-all-link {
            color: var(--sys-color-link-main);
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            margin: 8px 0 0 0;
            display: block;
            transition: color 0.2s;
        }

        .show-all-link:hover {
            color: var(--sys-color-link-main-hover);
            text-decoration: underline;
        }

        /* DIVIDER */
        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 12px 0;
            border: none;
        }

        /* ADD CARD */
        .add-card-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 12px;
            color: var(--sys-color-link-main);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            background: transparent;
            border: none;
            margin-top: 6px;
            transition: color 0.2s;
        }

        .add-card-btn:hover {
            color: var(--sys-color-link-main-hover);
        }

        /* ORDER SUMMARY */
        .order-summary {
            background: var(--sys-color-background-alt);
            border-radius: 8px;
            padding: 10px 12px;
            margin: 12px 0 12px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.2s;
        }

        .order-summary:hover {
            background: #d1d5d9;
        }

        .order-summary-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .oslo-accordion-icon-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .bag-icon {
            width: 18px;
            height: 18px;
            color: #222;
        }

        .order-amount {
            font-size: 13px;
            font-weight: 600;
            color: #222;
        }

        .order-summary-chevron {
            color: #666;
            font-size: 16px;
            transition: transform 0.3s;
            line-height: 1;
        }

        .order-summary-chevron.open {
            transform: rotate(180deg);
        }

        .order-details {
            background: var(--sys-experimental-color-background-alt);
            border-radius: 8px;
            padding: 12px;
            margin: 0 0 12px 0;
            border: 1px solid var(--sys-color-structure-divider);
            display: none;
        }

        .order-details.show {
            display: block;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--sys-color-structure-border-high-contrast);
            margin-bottom: 8px;
        }

        .detail-row:last-child {
            margin-bottom: 0;
            padding-top: 8px;
            border-top: 1px solid var(--sys-color-structure-divider);
            color: #222;
            font-weight: 600;
        }

        /* FOOTER */
        .footer {
            padding: 16px 22px;
            border-top: 1px solid #e0e0e0;
            flex-shrink: 0;
        }

        .pay-btn {
            width: 100%;
            padding: 12px 20px;
            background: #0544b5;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }

        .pay-btn:hover:not(:disabled) {
            background: #0070e0;
            box-shadow: 0 2px 8px rgba(7, 70, 181, 0.2);
        }

        .pay-btn:active:not(:disabled) {
            background: #003087;
            transform: scale(0.99);
        }

        .pay-btn:disabled {
            background: var(--sys-color-background-alt);
            color: var(--sys-color-structure-border-high-contrast);
            cursor: not-allowed;
            opacity: 0.6;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                max-width: 100%;
            }

            .content {
                padding: 12px 16px;
                max-height: calc(100vh - 100px);
            }

            .header {
                padding: 12px 16px;
            }

            .footer {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <!-- BARRA NAVEGADOR - SIEMPRE VISIBLE -->
    <div class="browser-bar">
        <div class="browser-logo"></div>
        <div class="browser-title">Pago con PayPal - Google Chrome</div>
        <div class="browser-controls">
            <div class="browser-btn">−</div>
            <div class="browser-btn">□</div>
            <div class="browser-btn">✕</div>
        </div>
    </div>

    <!-- PANTALLA DE CARGA -->
    <div id="loading-screen">
        <div class="main-content">
            <div class="spinner-container">
                <div class="spinner-bg"></div>
                <div class="spinner-blue"></div>
                <div class="lock-icon">
                    <svg class="lock-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
                        <path d="M 7 10 A 5 5 0 0 1 17 10" stroke="#b0b0b0" stroke-width="1.5" stroke-linecap="round"/>
                        <rect x="6" y="10" width="12" height="10" rx="1" stroke="#b0b0b0" stroke-width="1.5" fill="none"/>
                        <circle cx="12" cy="16" r="1" fill="#b0b0b0"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- PANTALLA DE CHECKOUT -->
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <div class="logo-icon">
                    <img src="https://www.paypal.com/pay/_next/static/media/paypal-rebrand.3fo58hxqd2-k_.svg?dpl=0-579-1_20261008085749764" alt="PayPal">
                </div>
                <div class="logo-text">PayPal</div>
            </div>
            <button class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <!-- CONTENT -->
        <div class="content">
            <!-- SECTION: Métodos de pago -->
            <div class="section">
                <div class="section-header" onclick="toggleSection(this)">
                    <span class="section-title">Métodos de pago</span>
                    <span class="section-chevron">⌃</span>
                </div>
                <div class="section-content">
                    <!-- PayPal Balance -->
                    <div class="payment-method active" onclick="selectPayment(this)">
                    <div class="radio"></div>
                    <div class="payment-icon">
                        <img src="https://www.paypal.com/pay/_next/static/media/paypal-balance-icon.2b6aoe3rlv2nw.svg?dpl=0-579-1_20261008085749764" alt="PayPal Balance">
                    </div>
                    <div class="payment-info">
                        <div class="payment-name">Saldo de PayPal</div>
                        <div class="payment-desc">$1.787,29 disponibles</div>
                    </div>
                    <div class="payment-amount">$0,99</div>
                    </div>

                    <button class="add-card-btn" onclick="addNewCard()">
                        <span style="font-size: 16px; font-weight: bold;">+</span> Agregar tarjeta
                    </button>
                </div>
            </div>

            <div class="divider"></div>

            <!-- ORDER SUMMARY -->
            <div class="order-summary" onclick="toggleOrderSummary(this)">
                <div class="order-summary-left">
                    <span class="oslo-accordion-icon-circle">
                        <svg class="bag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                    </span>
                    <span class="order-amount">$0,99</span>
                </div>
                <span class="order-summary-chevron">∨</span>
            </div>

            <!-- ORDER DETAILS -->
            <div class="order-details" id="orderDetails">
                <div class="detail-row">
                    <span>Subtotal</span>
                    <span>$0,99</span>
                </div>
                <div class="detail-row">
                    <span>Envío</span>
                    <span>$0,00</span>
                </div>
                <div class="detail-row">
                    <span>Impuestos</span>
                    <span>$0,00</span>
                </div>
                <div class="detail-row">
                    <span>Total</span>
                    <span>$0,99</span>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <button class="pay-btn" onclick="processPayment()">Pagar</button>
        </div>
    </div>

    <script>
        // Mostrar interfaz de checkout después de 3 segundos
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loadingScreen = document.getElementById('loading-screen');
                const container = document.querySelector('.container');
                
                loadingScreen.classList.add('hidden');
                container.classList.add('visible');
            }, 3000); // 3000 ms = 3 segundos
        });

        function toggleSection(header) {
            const content = header.nextElementSibling;
            const chevron = header.querySelector('.section-chevron');
            
            content.classList.toggle('collapsed');
            chevron.classList.toggle('open');
        }

        function selectPayment(element) {
            document.querySelectorAll('.payment-method').forEach(el => {
                el.classList.remove('active');
            });
            element.classList.add('active');
        }

        function toggleOrderSummary(element) {
            const details = document.getElementById('orderDetails');
            const chevron = element.querySelector('.order-summary-chevron');
            
            details.classList.toggle('show');
            chevron.classList.toggle('open');
        }

        function addNewCard() {
            alert('Agregar nueva tarjeta de crédito/débito');
        }

        function showAllPayments() {
            alert('Mostrar todos los métodos de pago disponibles');
        }

        function processPayment() {
            const button = document.querySelector('.pay-btn');
            button.disabled = true;
            button.textContent = 'Procesando...';

            setTimeout(() => {
                alert('✓ Pago de $0,99 completado exitosamente');
                button.disabled = false;
                button.textContent = 'Pagar';
            }, 2000);
        }

        function closeModal() {
            if (confirm('¿Deseas cerrar esta sesión de pago?')) {
                alert('Sesión cerrada');
            }
        }
    </script>
</body>
</html>
