<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal - Google Chrome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Barra de navegación */
        .browser-bar {
            width: 100%;
            height: 60px;
            background: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
        }

        .browser-icon {
            width: 24px;
            height: 24px;
            background: #4285f4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .browser-menu {
            width: 24px;
            height: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
        }

        .browser-menu span {
            width: 24px;
            height: 2px;
            background: #5f6368;
            border-radius: 1px;
        }

        .url-bar {
            flex: 1;
            height: 36px;
            background: white;
            border: 1px solid #dadce0;
            border-radius: 24px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #5f6368;
            margin: 0 8px;
        }

        .download-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5f6368;
            font-size: 18px;
            cursor: pointer;
        }

        /* Contenido principal */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
        }

        .container {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Círculo giratorio exterior */
        .spinner {
            position: absolute;
            width: 140px;
            height: 140px;
            border: 6px solid #e8e8e8;
            border-top: 6px solid #0070ba;
            border-right: 6px solid #0070ba;
            border-radius: 50%;
            animation: spin 2s linear infinite;
        }

        /* SVG del candado */
        .lock-svg {
            position: relative;
            z-index: 10;
            width: 60px;
            height: 60px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <!-- Barra de navegador -->
    <div class="browser-bar">
        <div class="browser-icon">⊕</div>
        <div class="browser-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="url-bar">🔒 about:blank</div>
        <div class="download-icon">⬇</div>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <div class="container">
            <div class="spinner"></div>
            <svg class="lock-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <!-- Arco superior del candado -->
                <path d="M 32 10 A 14 14 0 0 1 46 24" fill="none" stroke="#999999" stroke-width="3" stroke-linecap="round"/>
                
                <!-- Cuerpo del candado -->
                <rect x="16" y="24" width="32" height="28" rx="2" fill="none" stroke="#999999" stroke-width="3"/>
                
                <!-- Punto/ojo del candado -->
                <circle cx="32" cy="40" r="3" fill="#999999"/>
            </svg>
        </div>
    </div>
</body>
</html>
